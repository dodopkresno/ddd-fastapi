[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddd-fastapi"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Pragmatic modular monolith FastAPI starter"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "starlette>=1.3.1,<2", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["httpx2>=2.16,<3", "pytest>=8,<10", "ruff>=0.9,<1", "pyright>=1.1.390,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ddd_fastapi"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
